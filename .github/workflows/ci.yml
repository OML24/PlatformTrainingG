name: build-test-format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ZU_REQUIRE_PG17_CONTAINER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore ZuLms.sln
      - run: dotnet format whitespace ZuLms.sln --verify-no-changes --no-restore --include src/ZuLms.Web/Program.cs
      - run: dotnet build ZuLms.sln -c Release --no-restore
      - run: dotnet test ZuLms.sln -c Release --no-build
