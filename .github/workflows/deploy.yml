name: test-and-deploy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Testcontainers PostgreSQL 17 is mandatory in CI; ZU_TEST_PG is not accepted here.
      ZU_REQUIRE_PG17_CONTAINER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore ZuLms.sln
      - run: dotnet build ZuLms.sln -c Release --no-restore
      - run: dotnet test ZuLms.sln -c Release --no-build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zu-lms:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/zu-lms:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/zu-lms
            export TAG=${{ github.sha }}
            docker compose pull app
            docker compose run --rm app --migrate
            docker compose up -d
            docker image prune -f
