<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل أعضاء هيئة التدريس — جامعة الزرقاء</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#16334d;font:15px/1.8 "Segoe UI",Tahoma,Arial,sans-serif}a{color:#022c5a;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #dce4eb;padding:18px max(20px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:700}.brand small{display:block;color:#64748b;font-weight:400;font-size:12px}.demo{font-size:12px;background:#edf3f7;padding:5px 12px;border-radius:20px}main{max-width:1240px;padding:40px 20px;margin:auto}h1,h2,h3,p{margin:0}h1{font-size:30px;margin-bottom:7px}h2{font-size:24px}h3{font-size:18px}p,small{color:#5c7082}.intro{margin-bottom:25px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:15px;background:white;padding:22px;border:1px solid #dce4eb;border-radius:12px}.filters label{display:block;font-size:12px;margin-bottom:6px}input,select{width:100%;min-width:0;border:1px solid #cdd9e2;background:white;padding:10px 12px;border-radius:7px;color:#16334d}.count{margin:18px 0;font-size:13px}.members-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.member-card{display:block;background:white;border:1px solid #dce4eb;border-radius:13px;padding:24px}.member-card:hover{border-color:#88a7bc}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e7eff6;color:#022c5a;font-size:20px;font-weight:600;margin-bottom:14px}.member-card p{font-size:13px;margin-top:5px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tag{font-size:11px;padding:3px 10px;background:#eff4f8;color:#42647d;border-radius:20px}.open-profile{display:block;font-size:13px;color:#0e6385;margin-top:16px}.back{display:inline-block;border:1px solid #cdd9e2;border-radius:7px;padding:8px 15px;background:white;margin-bottom:24px}.profile-header{background:white;border:1px solid #dce4eb;padding:32px;border-radius:14px;display:flex;gap:25px;align-items:center}.profile-header .avatar{width:85px;height:85px;font-size:27px;flex-shrink:0;margin:0}.profile-layout{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}.profile-section{background:white;border:1px solid #dce4eb;border-radius:12px;padding:26px}.profile-section h3{margin-bottom:12px}.profile-section dl{margin:0}.profile-section dt{font-size:12px;color:#6a7f90;margin-top:12px}.profile-section dd{margin:0}footer{text-align:center;font-size:12px;color:#64748b;padding:25px}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3688b1;outline-offset:3px}[hidden]{display:none!important}.empty{padding:40px;background:white;border:1px dashed #bacbd8;border-radius:10px;text-align:center;grid-column:1/-1}@media(max-width:800px){.members-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr}.profile-layout{grid-template-columns:1fr}.profile-header{padding:22px;gap:18px;align-items:start}.profile-header h2{font-size:21px}}@media(max-width:480px){.members-grid{grid-template-columns:1fr}main{padding:26px 16px}header{padding:15px 16px;flex-wrap:wrap}h1{font-size:25px}.profile-header{flex-direction:column}.profile-header .avatar{width:65px;height:65px}}
</style></head><body>
<header><a class="brand" href="index.html">جامعة الزرقاء<small>منصة التدريب والتطوير المهني</small></a><span class="demo">بيانات تجريبية للعرض</span></header>
<main>
<section id="directory"><div class="intro"><h1>دليل أعضاء هيئة التدريس</h1><p>ابحث عن زملائك، وتعرّف إلى اختصاصاتهم وملفاتهم المهنية.</p></div><div class="filters"><div><label for="member-search">الاسم أو مجال الخبرة</label><input type="search" id="member-search" placeholder="ابحث عن اسم أو اختصاص…"></div><div><label for="college-filter">الكلية</label><select id="college-filter"><option value="all">جميع الكليات</option></select></div><div><label for="department-filter">القسم</label><select id="department-filter"><option value="all">جميع الأقسام</option></select></div></div><p id="member-count" class="count" aria-live="polite"></p><div id="members" class="members-grid"></div></section>
<section id="profile" hidden><a class="back" href="members-directory.html">→ العودة إلى دليل الأعضاء</a><div id="profile-content"></div></section>
</main><footer>الملفات المهنية متاحة لجميع مستخدمي المنصة. بيانات الدليل في هذا الديمو أمثلة وليست سجلاً رسمياً للجامعة.</footer>
<script src="js/member-directory.js"></script></body></html>
